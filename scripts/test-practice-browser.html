<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Practice browser smoke test</title>
<pre id="result">WAITING</pre>
<iframe id="site" src="../practice-test.html?lang=ru" style="width:1000px;height:800px"></iframe>
<script>
let testStarted = false;
document.getElementById("site").addEventListener("load", async () => {
  if (testStarted) return;
  testStarted = true;
  const result = document.getElementById("result");
  try {
    const doc = document.getElementById("site").contentDocument;
    const checks = [];
    const check = (label, value) => { if (!value) throw new Error(label); checks.push(label); };
    const input = doc.getElementById("word-input");
    const translation = doc.getElementById("translation-input");
    input.value = "sell";
    const previewStart = performance.now();
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("local translation appears while typing", translation.value === "продавать");
    check("local preview is under 500 ms", performance.now() - previewStart < 500);
    translation.value = "мой вариант";
    translation.dispatchEvent(new Event("input", { bubbles:true }));
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("manual translation is preserved", translation.value === "мой вариант");
    input.value = "school";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("new word replaces previous translation", translation.value === "школа");
    const win = doc.defaultView;
    win.Translator = { availability: async () => "unavailable" };
    const originalFetch = win.fetch;
    win.fetch = (url, options) => String(url).includes("mymemory.translated.net") ? Promise.resolve({ ok:true, json:async () => ({ responseStatus:200, responseData:{ translatedText:"тестовый перевод" } }) }) : originalFetch(url, options);
    input.value = "quasarify";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    await new Promise(resolve => setTimeout(resolve, 650));
    check("unknown word falls back to online translation", translation.value === "тестовый перевод");
    win.fetch = originalFetch;
    win.Translator = { availability: async () => "available", create: async () => ({ translate:async () => "переклад у браузері" }) };
    doc.querySelector('[data-practice-lang="uk"]').click();
    input.value = "school";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("language switch gives instant Ukrainian gloss", translation.value === "школа");
    input.value = "xylophorical";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    await new Promise(resolve => setTimeout(resolve, 600));
    check("ready browser translator works without a network call", translation.value === "переклад у браузері");
    doc.querySelector('[data-practice-lang="ru"]').click();
    check("six level decks", doc.querySelectorAll("#practice-deck-list .practice-deck").length === 6);
    check("three bridge decks", doc.querySelectorAll("#practice-bridge-list .practice-deck").length === 3);
    check("each level has 25 fixed sets", [...doc.querySelectorAll("#practice-deck-list .practice-deck")].every(deck => deck.querySelectorAll(".practice-module").length === 25));
    check("sets stay collapsed until a level is selected", doc.querySelectorAll(".practice-deck details[open]").length === 0);
    doc.querySelector('#practice-deck-list [data-deck="A1"] summary').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    check("selected level reveals its 25 sets", doc.querySelector('#practice-deck-list [data-deck="A1"] details').open);
    doc.querySelector('#practice-deck-list [data-deck="A2"] summary').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    check("only one level stays expanded", doc.querySelectorAll(".practice-deck details[open]").length === 1 && doc.querySelector('#practice-deck-list [data-deck="A2"] details').open);
    doc.querySelector('#practice-deck-list [data-deck="A1"] summary').click();
    await new Promise(resolve => setTimeout(resolve, 0));
    check("corrected common translation", doc.defaultView.FullRidePracticeTranslations.ru.can === "мочь");
    const secondSet = doc.querySelector('#practice-deck-list [data-start-deck="A1"][data-module="1"]');
    secondSet.click();
    check("modal opens", doc.getElementById("practice-modal").classList.contains("is-open"));
    check("preparation screen opens before study", !doc.getElementById("session-setup").hidden && doc.getElementById("session-study").hidden);
    check("preparation screen shows set and progress", doc.getElementById("setup-level").textContent.includes("A1") && doc.getElementById("setup-level").textContent.includes("2") && doc.getElementById("setup-progress").textContent.includes("0"));
    doc.querySelector('[data-session-mode="check"]').click();
    check("self-check mode can be selected", doc.querySelector('[data-session-mode="check"]').getAttribute("aria-checked") === "true");
    doc.getElementById("session-start").click();
    check("start button enters study", doc.getElementById("session-setup").hidden && !doc.getElementById("session-study").hidden);
    check("set contains exactly 20 words", doc.getElementById("session-counter").textContent === "1 из 20");
    check("fixed set starts at word 21", doc.getElementById("session-word").textContent === doc.defaultView.FullRidePracticePacks.A1[20]);
    check("self-check hides the meaning first", doc.getElementById("session-meaning").hidden && !doc.getElementById("session-reveal").hidden);
    doc.getElementById("session-reveal").click();
    check("meaning appears on request", !doc.getElementById("session-meaning").hidden && !doc.getElementById("session-actions").hidden);
    const first = doc.getElementById("session-word").textContent;
    let syncEvents = 0;
    win.addEventListener("fullride:local-data-changed", event => { if (event.detail?.kind === "packLearned") syncEvents += 1; });
    const start = performance.now();
    doc.querySelector('[data-rate="good"]').click();
    const elapsed = performance.now() - start;
    check("know advances without waiting", elapsed < 500 && doc.getElementById("session-word").textContent !== first);
    check("known word saves immediately", JSON.parse(doc.defaultView.localStorage.getItem("fullride-pack-learned-v1")).includes("A1:" + first));
    check("answer schedules account sync", syncEvents === 1);
    const second = doc.getElementById("session-word").textContent;
    doc.querySelector('[data-rate="again"]').click();
    check("unknown word is not counted as known", !JSON.parse(doc.defaultView.localStorage.getItem("fullride-pack-learned-v1")).includes("A1:" + second));
    const counterBefore = Number.parseInt(doc.getElementById("session-counter").textContent, 10);
    doc.getElementById("session-next").click();
    check("skip works without sentence", Number.parseInt(doc.getElementById("session-counter").textContent, 10) === counterBefore + 1);
    check("sentence stays optional", !doc.getElementById("session-sentence").value);
    doc.querySelector("[data-practice-close]").click();
    check("set percentage updates", doc.querySelector('#practice-deck-list [data-start-deck="A1"][data-module="1"] .practice-module__percent').textContent.trim().startsWith("5%"));
    const frame = document.getElementById("site");
    const reloaded = new Promise(resolve => frame.addEventListener("load", resolve, { once:true }));
    frame.contentWindow.location.reload();
    await reloaded;
    const reloadedDoc = frame.contentDocument;
    const savedSet = reloadedDoc.querySelector('#practice-deck-list [data-start-deck="A1"][data-module="1"]');
    check("progress survives reload", savedSet.querySelector(".practice-module__percent").textContent.trim().startsWith("5%"));
    result.textContent = "PASS: " + checks.join(", ") + `. Answer transition: ${elapsed.toFixed(1)} ms.`;
  } catch (error) { result.textContent = "FAIL: " + error.message; }
});
</script>
</html>
