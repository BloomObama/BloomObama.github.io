<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Practice browser smoke test</title>
<pre id="result">WAITING</pre>
<iframe id="site" src="../practice-test.html?lang=ru" style="width:1000px;height:800px"></iframe>
<script>
document.getElementById("site").addEventListener("load", async () => {
  const result = document.getElementById("result");
  try {
    const doc = document.getElementById("site").contentDocument;
    const checks = [];
    const check = (label, value) => { if (!value) throw new Error(label); checks.push(label); };
    const input = doc.getElementById("word-input");
    const translation = doc.getElementById("translation-input");
    input.value = "sell";
    const previewStart = performance.now();
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("local translation appears while typing", translation.value === "продавать");
    check("local preview is under 500 ms", performance.now() - previewStart < 500);
    translation.value = "мой вариант";
    translation.dispatchEvent(new Event("input", { bubbles:true }));
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("manual translation is preserved", translation.value === "мой вариант");
    input.value = "school";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("new word replaces previous translation", translation.value === "школа");
    const win = doc.defaultView;
    win.Translator = { availability: async () => "unavailable" };
    const originalFetch = win.fetch;
    win.fetch = (url, options) => String(url).includes("mymemory.translated.net") ? Promise.resolve({ ok:true, json:async () => ({ responseStatus:200, responseData:{ translatedText:"тестовый перевод" } }) }) : originalFetch(url, options);
    input.value = "quasarify";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    await new Promise(resolve => setTimeout(resolve, 650));
    check("unknown word falls back to online translation", translation.value === "тестовый перевод");
    win.fetch = originalFetch;
    win.Translator = { availability: async () => "available", create: async () => ({ translate:async () => "переклад у браузері" }) };
    doc.querySelector('[data-practice-lang="uk"]').click();
    input.value = "school";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    check("language switch gives instant Ukrainian gloss", translation.value === "школа");
    input.value = "xylophorical";
    input.dispatchEvent(new Event("input", { bubbles:true }));
    await new Promise(resolve => setTimeout(resolve, 600));
    check("ready browser translator works without a network call", translation.value === "переклад у браузері");
    doc.querySelector('[data-practice-lang="ru"]').click();
    check("six level decks", doc.querySelectorAll("#practice-deck-list .practice-deck").length === 6);
    check("three bridge decks", doc.querySelectorAll("#practice-bridge-list .practice-deck").length === 3);
    doc.querySelector('#practice-deck-list [data-start-deck="A1"]').click();
    check("modal opens", doc.getElementById("practice-modal").classList.contains("is-open"));
    const first = doc.getElementById("session-word").textContent;
    doc.getElementById("session-next").click();
    check("next works before reveal", doc.getElementById("session-word").textContent !== first);
    while (!doc.defaultView.FullRidePracticeTranslations.ru[doc.getElementById("session-word").textContent]) doc.getElementById("session-next").click();
    const second = doc.getElementById("session-word").textContent;
    const counterBefore = Number.parseInt(doc.getElementById("session-counter").textContent, 10);
    const start = performance.now();
    doc.getElementById("session-reveal").click();
    const elapsed = performance.now() - start;
    const gloss = doc.getElementById("session-translation").textContent;
    check("Russian gloss appears on reveal", Boolean(gloss) && !gloss.includes("загружается"));
    check("reveal is synchronous", elapsed < 500);
    doc.getElementById("session-next").click();
    check("next works without sentence", doc.getElementById("session-word").textContent !== second);
    check("next advances counter", doc.getElementById("session-counter").textContent.startsWith((counterBefore + 1) + " /"));
    check("sentence stays optional", !doc.getElementById("session-sentence").value);
    result.textContent = "PASS: " + checks.join(", ") + `. Reveal: ${elapsed.toFixed(1)} ms.`;
  } catch (error) { result.textContent = "FAIL: " + error.message; }
});
</script>
</html>
